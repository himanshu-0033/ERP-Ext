<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ERP Autofill</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <span class="eyebrow">IIT KHARAGPUR</span>
  <h1>ERP Autofill</h1>
  <p class="muted">Your login, a little faster.</p>
  <div id="state" class="badge">Checking vault…</div>
  <form id="unlock-form" hidden>
    <label for="passphrase">Vault passphrase</label>
    <input id="passphrase" type="password" required maxlength="1024" autocomplete="off">
    <button type="submit" class="primary">Unlock vault</button>
  </form>
  <div id="actions" hidden>
    <button id="send" class="primary">Fill &amp; Send OTP</button>
    <button id="fill">Fill details only</button>
    <button id="lock">Lock vault</button>
  </div>
  <button id="settings">Set up / edit profile</button>
  <button id="open" class="link">Open ERP login ↗</button>
  <p id="status" role="status" aria-live="polite">Enter received OTPs yourself. Your vault stays on this device.</p>
  <script src="popup.js"></script>
</body>
</html>
